<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CY4GATE — Comunicati Stampa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-bg: #0d1b2a;
      --sidebar-hover: #1a3a5c;
      --sidebar-active: #1f5fa6;
      --sidebar-border: #1e3a5f;
      --accent: #3b82f6;
      --text-muted-custom: #8ba3c0;
      --tag-2024: #0e6655;
      --tag-2025: #6b4c00;
      --tag-2026: #5a1e7e;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── TOPBAR ── */
    #topbar {
      height: 52px;
      background: #0a1628;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 1rem;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }
    #topbar .brand {
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    #topbar .brand span {
      color: var(--accent);
    }
    #topbar .subtitle {
      color: var(--text-muted-custom);
      font-size: .78rem;
      white-space: nowrap;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      height: calc(100vh - 52px);
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 340px;
      min-width: 260px;
      max-width: 400px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    #search-wrap {
      padding: .75rem .85rem .6rem;
      border-bottom: 1px solid var(--sidebar-border);
    }

    #search-input {
      background: #162535;
      border: 1px solid #2a4a6e;
      color: #e2eaf4;
      border-radius: 6px;
      padding: .45rem .75rem .45rem 2rem;
      width: 100%;
      font-size: .82rem;
      outline: none;
      transition: border-color .15s;
    }
    #search-input::placeholder { color: #4e6d8c; }
    #search-input:focus { border-color: var(--accent); }

    .search-icon {
      position: absolute;
      left: .65rem;
      top: 50%;
      transform: translateY(-50%);
      color: #4e6d8c;
      pointer-events: none;
      font-size: .85rem;
    }

    #result-count {
      color: var(--text-muted-custom);
      font-size: .72rem;
      margin-top: .3rem;
      padding-left: .1rem;
    }

    #list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: .4rem 0;
    }

    #list-wrap::-webkit-scrollbar { width: 5px; }
    #list-wrap::-webkit-scrollbar-track { background: transparent; }
    #list-wrap::-webkit-scrollbar-thumb { background: #2a4a6e; border-radius: 4px; }

    .pr-item {
      display: block;
      padding: .6rem .85rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .pr-item:hover {
      background: var(--sidebar-hover);
      border-left-color: var(--accent);
    }
    .pr-item.active {
      background: var(--sidebar-active);
      border-left-color: #60a5fa;
    }
    .pr-item + .pr-item {
      border-top: 1px solid #111f30;
    }

    .pr-date {
      font-size: .72rem;
      color: var(--text-muted-custom);
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    .pr-title {
      font-size: .82rem;
      color: #c8dcf0;
      line-height: 1.35;
      margin-top: .18rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pr-item.active .pr-title { color: #fff; }

    .badge-year {
      font-size: .65rem;
      padding: .12em .45em;
      border-radius: 3px;
      font-weight: 600;
      margin-left: .4rem;
      vertical-align: middle;
    }
    .badge-2024 { background: #0e4d3e; color: #4ecca3; }
    .badge-2025 { background: #4d3700; color: #f0a500; }
    .badge-2026 { background: #3a0e5a; color: #c084fc; }

    #empty-msg {
      color: #4e6d8c;
      font-size: .82rem;
      padding: 1.5rem .85rem;
      display: none;
    }

    /* ── CONTENT ── */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f3f6fa;
      overflow: hidden;
    }

    #content-header {
      background: #fff;
      border-bottom: 1px solid #dde4ef;
      padding: .6rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      flex-shrink: 0;
    }

    #content-meta {
      flex: 1;
      min-width: 0;
    }
    #content-date {
      font-size: .75rem;
      color: #6b7e99;
      font-weight: 500;
    }
    #content-title {
      font-size: .95rem;
      font-weight: 600;
      color: #1a2b45;
      margin-top: .15rem;
      line-height: 1.4;
    }
    #content-url-link {
      font-size: .72rem;
      color: var(--accent);
      word-break: break-all;
      margin-top: .25rem;
      display: inline-block;
    }

    #open-btn {
      flex-shrink: 0;
      font-size: .78rem;
      padding: .3rem .75rem;
    }

    #pdf-frame {
      flex: 1;
      border: none;
      background: #e8ecf3;
    }

    #placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8ba3c0;
      gap: .5rem;
    }
    #placeholder svg {
      opacity: .25;
    }
    #placeholder p {
      font-size: .9rem;
      margin: 0;
    }

    mark {
      background: #facc15;
      padding: 0 .1em;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="brand">CY4<span>GATE</span></div>
  <div class="subtitle">Comunicati Stampa Finanziari</div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="search-wrap">
      <div style="position:relative">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Cerca per titolo o data (es. 2026, contratto)…" autocomplete="off" spellcheck="false">
      </div>
      <div id="result-count"></div>
    </div>
    <div id="list-wrap">
      <div id="empty-msg">Nessun comunicato trovato.</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div id="content-header" style="display:none">
      <div id="content-meta">
        <div id="content-date"></div>
        <div id="content-title"></div>
        <a id="content-url-link" target="_blank" rel="noopener"></a>
      </div>
      <a id="open-btn" class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener">
        ↗ Apri
      </a>
    </div>
    <div id="placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <p>Seleziona un comunicato dalla sidebar</p>
    </div>
    <iframe id="pdf-frame" style="display:none" title="Comunicato stampa"></iframe>
  </div>

</div>

<script src="data.js"></script>
<script>
  const listWrap = document.getElementById('list-wrap');
  const searchInput = document.getElementById('search-input');
  const resultCount = document.getElementById('result-count');
  const emptyMsg = document.getElementById('empty-msg');
  const contentHeader = document.getElementById('content-header');
  const contentDate = document.getElementById('content-date');
  const contentTitle = document.getElementById('content-title');
  const contentUrlLink = document.getElementById('content-url-link');
  const openBtn = document.getElementById('open-btn');
  const pdfFrame = document.getElementById('pdf-frame');
  const placeholder = document.getElementById('placeholder');

  let activeItem = null;

  // Converte "DD/MM/YYYY" → Date per ordinamento (già DESC nel JSON)
  function renderList(query) {
    const q = query.trim().toLowerCase();
    const tokens = q ? q.split(/\s+/) : [];

    // Rimuove vecchi item (non il messaggio vuoto)
    listWrap.querySelectorAll('.pr-item').forEach(el => el.remove());

    let count = 0;

    COMUNICATI.forEach((rec, idx) => {
      const searchTarget = `${rec.data} ${rec.titolo} ${rec.anno}`.toLowerCase();
      const matches = tokens.length === 0 || tokens.every(t => searchTarget.includes(t));
      if (!matches) return;

      count++;
      const item = document.createElement('div');
      item.className = 'pr-item';
      item.dataset.idx = idx;

      // Highlight
      const highlightTitle = tokens.length
        ? rec.titolo.replace(new RegExp(`(${tokens.map(escapeRe).join('|')})`, 'gi'), '<mark>$1</mark>')
        : rec.titolo;
      const highlightDate = tokens.length
        ? rec.data.replace(new RegExp(`(${tokens.map(escapeRe).join('|')})`, 'gi'), '<mark>$1</mark>')
        : rec.data;

      item.innerHTML = `
        <div class="pr-date">
          ${highlightDate} ${rec.ora ? '· ' + rec.ora : ''}
          <span class="badge-year badge-${rec.anno}">${rec.anno}</span>
        </div>
        <div class="pr-title">${highlightTitle}</div>
      `;

      item.addEventListener('click', () => selectItem(item, rec));
      listWrap.insertBefore(item, emptyMsg);
    });

    emptyMsg.style.display = count === 0 ? 'block' : 'none';
    resultCount.textContent = count === COMUNICATI.length
      ? `${count} comunicati`
      : `${count} di ${COMUNICATI.length} comunicati`;
  }

  function escapeRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function selectItem(itemEl, rec) {
    if (activeItem) activeItem.classList.remove('active');
    itemEl.classList.add('active');
    activeItem = itemEl;

    contentDate.textContent = `${rec.data}  ·  ${rec.ora}`;
    contentTitle.textContent = rec.titolo;
    contentUrlLink.href = rec.url || '#';
    contentUrlLink.textContent = rec.url || '';
    openBtn.href = rec.url || '#';

    contentHeader.style.display = 'flex';
    placeholder.style.display = 'none';
    pdfFrame.style.display = 'block';
    pdfFrame.src = rec.url || '';
  }

  searchInput.addEventListener('input', () => {
    activeItem = null; // reset selezione al filtraggio
    renderList(searchInput.value);
  });

  // Init
  renderList('');
</script>
</body>
</html>
